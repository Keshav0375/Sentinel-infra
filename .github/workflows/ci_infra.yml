# ─────────────────────────────────────────────────────────────────────────────
# Deploy — the only automated writer of Sentinel's Azure estate.
# architecture/infra.md §7.2 (superseded — see decisions.md 2026-08-24)
#
# ── Dispatch only, and that is a consequence not a preference ────────────────
# Push-to-main auto-apply cannot survive multi-deployment: a push has no way to
# know WHICH deployment it means. Every apply is now a deliberate button press,
# and no identity carries a `ref:refs/heads/main` subject any more.
#
# ── The environment is the security boundary ─────────────────────────────────
# Declaring `environment: production` rewrites the OIDC subject to
# `repo:<owner>/<repo>:environment:production`, replacing the branch form. That
# is the ONLY subject gha-deploy federates on, and GitHub will not mint it for a
# `pull_request` event — so the identity that can create and destroy the
# subscription's contents is unreachable from a PR by construction, not by a
# rule someone could misconfigure.
# ─────────────────────────────────────────────────────────────────────────────

name: "Sentinel Infra — Deploy"

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Which layer to apply.'
        type: choice
        required: true
        default: platform
        options: [platform, deployment]
      deployment:
        description: 'Deployment name (deployment layer only). 2-8 lowercase alphanumeric.'
        type: string
        required: false
        default: sentinel
      environment_name:
        description: 'Environment within the deployment. The platform layer uses `plat`.'
        type: string
        required: false
        default: plat
      mode:
        description: 'apply = write · plan-only = show the diff and stop · refresh-only = reconcile state with reality'
        type: choice
        required: true
        default: plan-only
        options: [plan-only, apply, refresh-only]

permissions:
  id-token: write
  contents: read

# Never cancel an in-flight apply — a killed apply leaves the state lease held
# and the infrastructure half-changed. Queue instead.
concurrency:
  group: infra-apply
  cancel-in-progress: false

env:
  TF_VERSION: "1.15.8"

jobs:
  run-deploy:
    name: Run Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Unlike the plan job, this one CAN start the database — gha-deploy holds
      # Contributor. A stopped flexible-server errors terraform with
      # `400 ServerStoppedError`, and stopped is its NORMAL idle state, so an
      # apply that did not check would fail most of the time.
      #
      # Starting an already-running server is an error rather than a no-op, hence
      # the state check rather than `|| true`.
      - name: Ensure the database is running
        run: |
          server="$(az postgres flexible-server list --query "[0].name" -o tsv)"
          if [ -z "${server}" ]; then
            echo "no flexible-server yet — first apply will create it"
            exit 0
          fi
          rg="$(az postgres flexible-server list --query "[0].resourceGroup" -o tsv)"
          state="$(az postgres flexible-server show -n "${server}" -g "${rg}" --query state -o tsv)"
          echo "postgres ${server}: ${state}"
          if [ "${state}" != "Ready" ]; then
            az postgres flexible-server start -n "${server}" -g "${rg}"
          fi

      - name: Initialize
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init -input=false

      - name: Select workspace
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_LAYER: ${{ inputs.layer }}
          TF_DEPLOYMENT: ${{ inputs.deployment }}
          TF_ENVIRONMENT: ${{ inputs.environment_name }}
        # A deployment gets its OWN workspace, and that is the safety property:
        # its state contains no platform resource, so destroying it cannot reach
        # the shared cluster.
        run: |
          if [ "${TF_LAYER}" = "platform" ]; then
            ws=platform
          else
            ws="${TF_DEPLOYMENT}-${TF_ENVIRONMENT}"
          fi
          echo "workspace: ${ws}"
          terraform workspace select "${ws}" 2>/dev/null || terraform workspace new "${ws}"

      - name: Deploy
        env:
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_MODE: ${{ inputs.mode }}
          TF_LAYER: ${{ inputs.layer }}
          TF_DEPLOYMENT: ${{ inputs.deployment }}
          TF_ENVIRONMENT: ${{ inputs.environment_name }}
          TF_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_LOCATION: ${{ vars.AZURE_LOCATION }}
          TF_PG_ADMIN_OBJECT_ID: ${{ vars.PG_ADMIN_OBJECT_ID }}
          TF_PG_ADMIN_PRINCIPAL_NAME: ${{ vars.PG_ADMIN_PRINCIPAL_NAME }}
        # `plan-only` is the default deliberately: the destructive option should
        # be the one you choose, not the one you get by pressing Enter.
        run: |
          args=(-no-color -input=false)
          case "${TF_MODE}" in
            plan-only)    verb=plan ;;
            refresh-only) verb=apply; args+=(-auto-approve -refresh-only) ;;
            *)            verb=apply; args+=(-auto-approve) ;;
          esac
          echo "running: terraform ${verb} ${args[*]}"
          terraform "${verb}" "${args[@]}" \
            -var="layer=${TF_LAYER}" \
            -var="deployment=${TF_DEPLOYMENT}" \
            -var="environment=${TF_ENVIRONMENT}" \
            -var="subscription_id=${TF_SUBSCRIPTION_ID}" \
            -var="location=${TF_LOCATION}" \
            -var="pg_admin_object_id=${TF_PG_ADMIN_OBJECT_ID}" \
            -var="pg_admin_principal_name=${TF_PG_ADMIN_PRINCIPAL_NAME}"
